const kv=`<div class="kv"><b>alias</b><span>${esc(SITE.short)}</span><b>focus</b><span>${esc(SITE.focus)}</span><b>platforms</b><span>${esc(SITE.platforms)}</span><b>status</b><span style="color:var(--grn)">● ${esc(SITE.status)}</span></div>`;
const V={
home:()=>`<section class="hero"><div><p class="pr mono">root@salem:~# whoami</p><pre class="ban" aria-label="${esc(SITE.name)}">${esc(BANNER)}</pre><h1 class="name" data-t="${esc(SITE.name)}">${esc(SITE.name)}</h1><div class="role" id="role"></div><p class="lead">${esc(SITE.bio[0])}</p><div class="btns"><a class="btn p" href="#writeups">./read_writeups</a><a class="btn" href="#contact">./contact</a></div></div><div class="id">${avatar()}${kv}</div></section>
<div class="two">${panel("skills.json",chips(Object.values(SITE.skills).join(", ")))}${panel("latest_writeups",sorted().slice(0,3).map(prow).join(""),0)}</div>`,
about:()=>`<h2 class="pg hd">about</h2><p class="lede">Who I am and what I’m learning.</p><div class="two" style="margin-bottom:18px">${panel("bio.md",SITE.bio.map(b=>`<p style="margin:0 0 10px">${esc(b)}</p>`).join(""))}${panel("system_info",avatar()+kv)}</div>${panel("skills.json",Object.entries(SITE.skills).map(([k,v])=>`<h3 style="margin:0 0 6px;font-size:16px">${esc(k)}</h3><div style="margin-bottom:10px">${chips(v)}</div>`).join(""))}`,
writeups:()=>{const all=["All",...new Set(POSTS.flatMap(p=>[p.category,...p.tags]))],items=filt();
 return`<h2 class="pg hd">writeups</h2><p class="lede">Boxes, challenges and things I broke on purpose.</p><input class="s" id="q" type="search" placeholder="grep writeups..." value="${esc(q)}" aria-label="Search writeups"><div class="chips">${all.map(t=>`<button data-t="${esc(t)}" class="${t==tag?"on":""}">${esc(t)}</button>`).join("")}</div>${panel("mission_log",`<div id="items">${items.length?items.map(prow).join(""):'<p style="padding:18px 20px;margin:0">No matches. Clear the search or pick another tag.</p>'}</div>`,0)}`},
contact:()=>`<h2 class="pg hd">contact</h2><p class="lede">Email is the fastest way to reach me.</p>${panel("mail",`<div class="kv" style="grid-template-columns:70px 1fr;margin-bottom:16px"><b>to</b><span style="font-size:15px">${esc(SITE.email)}</span></div><div class="btns"><a class="btn p" href="mailto:${esc(SITE.email)}">./send_mail</a><button class="btn" id="cp">./copy_address</button></div>`)}${panel("links",SITE.links.map(l=>`<a class="log" style="grid-template-columns:1fr auto" href="${esc(l[2])}" target="_blank" rel="noopener"><div><h3>${esc(l[0])}</h3><p>${esc(l[1])}</p></div><span class="dt">${esc(l[2].replace(/^https?:\/\/(www\.)?/,""))}</span></a>`).join(""),0)}`
};
const article=p=>`<div class="panel art"><div class="ph"><b>┌─[</b> writeups/${esc(p.slug)}.md <b>]──</b></div><div class="pb"><a class="mono" style="font-size:13px" href="#writeups">&lt; cd ..</a><h1 class="hd">${esc(p.title)}</h1><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px">${badge(p)}<span class="mono" style="color:var(--mute);font-size:13px">${esc(p.category)} | ${p.date}</span></div><div>${p.tags.map((t,i)=>`<span class="chip c${i%5}">#${esc(t)}</span>`).join("")}</div>${md(p.body)}</div></div>`;

function route(){clearTimeout(tm);const h=location.hash.slice(1)||"home",p=h.startsWith("w-")&&POSTS.find(x=>"w-"+x.slug==h),cur=p?"writeups":(V[h]?h:"home");
 $("#view").innerHTML=p?article(p):V[cur]();
 $("#nav").innerHTML=NAV.map(n=>`<a class="${n[0]==cur?"on":""}" href="#${n[0]}">${n[1]}</a>`).join("");
 document.title=p?p.title+" – "+SITE.short:SITE.short+" – "+SITE.roles[0];scrollTo(0,0);typer()}
function typer(){const el=$("#role");if(!el)return;const R=SITE.roles;if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.textContent=R.join(" / ");return}
 let i=0,j=0,d=false;(function t(){const w=R[i];el.textContent=w.slice(0,j);if(!d&&j==w.length){d=true;tm=setTimeout(t,1400);return}if(d&&j==0){d=false;i=(i+1)%R.length}j+=d?-1:1;tm=setTimeout(t,d?35:80)})()}
addEventListener("hashchange",route);
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value.toLowerCase();$("#items").innerHTML=filt().map(prow).join("")||'<p style="padding:18px 20px;margin:0">No matches.</p>'}});
document.addEventListener("click",e=>{const t=e.target,b=t.closest(".chips button");if(b){tag=b.dataset.t;$("#view").innerHTML=V.writeups()}
 const cp=t.closest(".cpy"),em=t.id=="cp";if(cp||em){const txt=cp?CODES[cp.dataset.i]:SITE.email,el=cp||t,old=el.textContent;try{navigator.clipboard.writeText(txt).then(()=>el.textContent=cp?"copied!":"copied",()=>el.textContent="failed")}catch(x){el.textContent="failed"}setTimeout(()=>el.textContent=old,1400)}});
$("#fl").textContent=SITE.links.map(l=>l[0]).join(" | ");$("#yr").textContent=new Date().getFullYear();
setInterval(()=>$("#clock").textContent="ONLINE "+new Date().toTimeString().slice(0,8),1000);

/* matrix rain */
(function(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=$("#rain"),x=c.getContext("2d"),ch="01アイウエオカキクケコサシスセソ{}[]<>/#$%&=+*ABCDEF",fs=15,TN=["63,207,110","63,207,110","63,207,110","90,169,255","227,179,65"];let W,H,D,T;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight;const n=Math.ceil(W/fs);D=Array.from({length:n},()=>Math.random()*H/fs);T=Array.from({length:n},()=>TN[Math.random()*5|0])};rs();addEventListener("resize",rs);
 setInterval(()=>{x.fillStyle="rgba(3,5,4,.09)";x.fillRect(0,0,W,H);x.font=fs+"px monospace";D.forEach((y,i)=>{x.fillStyle=`rgba(${T[i]},.75)`;x.fillText(ch[Math.random()*ch.length|0],i*fs,y*fs);D[i]=y*fs>H&&Math.random()>.975?0:y+1})},60)})();
/* network background */
(function(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const cv=$("#net"),x=cv.getContext("2d");let W,H,N=[],M={x:-999,y:-999};
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;N=Array.from({length:Math.min(70,W*H/16000|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))};rs();addEventListener("resize",rs);
 addEventListener("pointermove",e=>{M.x=e.clientX;M.y=e.clientY});
 (function f(){x.clearRect(0,0,W,H);for(const a of N){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1}
  for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<140){x.strokeStyle=`rgba(63,207,110,${.2*(1-d/140)})`;x.lineWidth=1;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}
   const dm=Math.hypot(a.x-M.x,a.y-M.y);if(dm<170){x.strokeStyle=`rgba(227,179,65,${.55*(1-dm/170)})`;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(M.x,M.y);x.stroke()}
   x.fillStyle="rgba(150,240,180,.6)";x.beginPath();x.arc(a.x,a.y,1.8,0,7);x.fill()}
  requestAnimationFrame(f)})()})();
route();
</script>
</body>
</html>
